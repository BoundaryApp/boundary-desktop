<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Run control — Boundary stop-button study</title>
  <!-- Shared study skin, inlined from ../message-actions-ux-study/study.css so this file stands alone. -->
  <style>
/* Shared chrome for the Boundary message-actions UX study kit. The chat skin is shared too (end of file); per-direction CSS lives in each HTML file. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
}

html {
  color-scheme: dark;
}

body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
}

code,
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Study review bar ------------------------------------------------------- */

.study-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 36px;
  padding: 4px 14px;
  background: #111113;
  color: #c8c8ce;
  border-bottom: 1px solid #2a2a30;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.study-bar a {
  text-decoration: none;
}

.study-bar .brand {
  color: #f2f2f4;
  font-weight: 580;
  letter-spacing: -0.02em;
}

.study-bar nav {
  display: flex;
  gap: 2px;
}

.study-bar nav a {
  padding: 4px 8px;
  border-radius: 6px;
  color: #9a9aa3;
}

.study-bar nav a:hover,
.study-bar nav a.is-current {
  color: #f2f2f4;
  background: #222228;
}

.study-bar .spacer {
  flex: 1;
}

.study-bar label {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #9a9aa3;
  cursor: pointer;
  user-select: none;
}

.study-bar input {
  accent-color: #8b87f8;
}

html.embed .study-bar {
  display: none;
}

/* App stage -------------------------------------------------------------- */

.app-stage {
  height: calc(100vh - 36px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

html.embed .app-stage {
  height: 100vh;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 38px;
  padding: 0 12px;
  flex-shrink: 0;
}

.lights {
  display: flex;
  gap: 6px;
}

.lights i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #3a3a40;
}

.titlebar .win-title {
  color: inherit;
  opacity: 0.55;
  font-size: 12px;
}

/* Design notes ----------------------------------------------------------- */

.note {
  display: none;
  position: absolute;
  z-index: 4;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #8b87f8;
  color: #0d0d10;
  font-size: 10px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}

.note[data-tip]::after {
  content: attr(data-tip);
  display: none;
  position: absolute;
  left: 22px;
  top: 50%;
  transform: translateY(-50%);
  width: max-content;
  max-width: 240px;
  padding: 8px 10px;
  border-radius: 6px;
  background: #111113;
  color: #ececf0;
  border: 1px solid #3a3a44;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  text-align: left;
  white-space: normal;
}

.note:hover::after {
  display: block;
}

html.notes-on .note {
  display: block;
}

/* Shared view switching: only elements marked .screen participate. */

.screen {
  display: none;
  min-height: 0;
}

body[data-screen="chat"] .screen.chat,
body[data-screen="services"] .screen.services,
body[data-screen="resources"] .screen.resources,
body[data-screen="settings"] .screen.settings,
body[data-screen="empty"] .screen.empty,
body[data-screen="connecting"] .screen.connecting,
body[data-screen="ready"] .screen.ready,
body[data-screen="denied"] .screen.denied {
  display: flex;
}

/* Chat skin (shared by all three directions) ----------------------------- */
/* Mirrors src/renderer/styles/tokens.css and ADR 0020 (centered 720px column). */

:root {
  --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #0d0d0f;
  --rail: #111113;
  --panel: #161618;
  --hover: #1d1d22;
  --line: #2a2a30;
  --line-strong: #3a3a44;
  --text: #f5f5f7;
  --muted: #c4c4cc;
  --faint: #9e9ea8;
  --accent: #8b87f8;
  --accent-dim: #26244a;
  --user: #1c1c22;
  --ok: #86c089;
  --warn: #e0b36a;
  --solid-fg: #111;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  --chat-column: 720px;
  --se: #6f8fa3;
}

html.light {
  color-scheme: light;
  --bg: #f3f1ea;
  --rail: #fffcf6;
  --panel: #fffcf6;
  --hover: #ece8dc;
  --line: #e3dfd3;
  --line-strong: #d4d0c4;
  --text: #1c1b17;
  --muted: #5c594f;
  --faint: #7a766c;
  --accent: #1c1b17;
  --accent-dim: #ece8dc;
  --user: #fffcf6;
  --ok: #3d6b40;
  --warn: #8a5a1a;
  --solid-fg: #fffcf6;
  --shadow: 0 10px 28px rgba(60, 50, 30, 0.14);
}

html.light .titlebar .lights i { background: #d4d0c4; }

body { background: var(--bg); color: var(--text); font-family: var(--font-ui); }
.mono { font-family: var(--font-mono); }
.app-stage { background: var(--bg); }
.titlebar { background: var(--rail); border-bottom: 1px solid var(--line); color: var(--muted); }
.shell { display: flex; flex: 1; min-height: 0; }

/* Review state switcher in the title bar */
.states { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.states .grp { display: flex; gap: 4px; }
.states .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.states button {
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
}
.states button.is-on { color: var(--text); background: var(--hover); }

/* Icon rail + left panel */
.icon-rail {
  width: 48px; background: var(--rail); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; gap: 4px;
}
.icon-rail .mark { width: 22px; height: 22px; margin: 2px 0 10px; border: 1px solid var(--line); border-radius: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.is-on { background: var(--accent-dim); color: var(--accent); }
.icon-rail .end { margin-top: auto; }

.left {
  width: 248px; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.proj-trigger {
  display: flex; align-items: center; gap: 10px; margin: 10px 8px 6px; padding: 10px;
  border-radius: 12px; background: var(--accent-dim); border: 1px solid var(--line); text-align: left;
}
.glyph {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  font-size: 12px; font-weight: 650; color: #fff; flex-shrink: 0; background: #c4a574;
}
.proj-copy .name { display: block; font-weight: 580; }
.proj-copy .path { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; }
.sect {
  padding: 10px 6px 4px 12px; font-size: 10px; font-weight: 650; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint);
}
.row {
  display: flex; align-items: center; gap: 8px; margin: 1px 8px; padding: 7px 8px;
  border-radius: 7px; color: var(--muted); text-align: left; width: calc(100% - 16px);
}
.row:hover, .row.is-on { background: var(--hover); color: var(--text); }
.row.child { padding-left: 22px; }
.row.child::before { content: "↳"; color: var(--faint); margin-left: -14px; }
.row .badge { margin-left: auto; font-size: 10px; color: var(--faint); }

/* Center pane: centered column per ADR 0020 */
.center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
.thread-head {
  height: 42px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--muted); flex-shrink: 0;
}
.thread-head strong { color: var(--text); font-weight: 580; }
.thread-head .role { color: var(--faint); font-weight: 400; }
.thread-head a.from { color: var(--faint); font-size: 12px; text-decoration: none; border-bottom: 1px dotted var(--faint); }

.log { flex: 1; overflow: auto; padding: 28px 36px 40px; }
.col { max-width: var(--chat-column); margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

.msg { position: relative; }
.who {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 12px; color: var(--faint); margin-bottom: 10px; font-weight: 500; letter-spacing: 0.01em;
}
.bubble {
  padding: 12px 16px; border-radius: 12px; background: var(--user); border: 1px solid var(--line);
  font-size: 15px; line-height: 1.55;
}
.prose { font-family: var(--font-prose); font-size: 15px; line-height: 1.6; }
.prose p { margin: 0 0 12px; max-width: 62ch; }
.prose p:last-child { margin-bottom: 0; }

.day {
  display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px;
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
}
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.mark-line { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; }
.mark-line::before, .mark-line::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.mark-line a { color: var(--muted); }

/* Hover-revealed action row: shared by every direction ------------------- */
.acts { display: flex; align-items: center; gap: 2px; }
.act {
  height: 28px; min-width: 28px; padding: 0 6px; border-radius: 7px; color: var(--faint);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px;
}
.act:hover { background: var(--hover); color: var(--text); }
.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--text); }
.act svg { width: 15px; height: 15px; flex-shrink: 0; }
.act .lbl { display: none; }
.act.is-done { color: var(--ok); }
.act.is-done .lbl { display: inline; }
.act.caret { min-width: 18px; padding: 0 2px; margin-left: -2px; }
.stamp { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stamp[title] { cursor: default; }
.edited { color: var(--faint); font-size: 11px; font-style: italic; }

.versions { display: inline-flex; align-items: center; gap: 0; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.versions .act { min-width: 22px; padding: 0 3px; }

/* Visibility contract: hidden at rest, shown on hover or keyboard focus, no layout shift. */
.reveal { opacity: 0; transition: opacity 120ms ease 60ms; }
.msg:hover .reveal,
.msg:focus-within .reveal,
.msg.force-hover .reveal { opacity: 1; transition-delay: 0ms; }
.reveal.pinned { opacity: 1; }

/* Menus and toasts */
.menu {
  position: absolute; z-index: 8; min-width: 292px; padding: 6px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--rail); box-shadow: var(--shadow);
}
.menu .kicker {
  font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--faint); padding: 4px 8px 6px;
}
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 7px 8px; border-radius: 8px; color: var(--text);
}
.menu button:hover, .menu button.is-on { background: var(--hover); }
.menu svg { width: 15px; height: 15px; flex-shrink: 0; align-self: flex-start; margin-top: 2px; color: var(--faint); }
.menu button small { display: block; color: var(--faint); font-size: 11px; margin-top: 1px; }
.menu button kbd, .kbd {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--faint);
}
.menu button[disabled] { color: var(--faint); cursor: not-allowed; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }

.toast {
  position: absolute; left: 50%; top: 54px; transform: translateX(-50%); z-index: 9;
  display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 10px;
  background: var(--text); color: var(--solid-fg); font-size: 13px; box-shadow: var(--shadow);
}
.toast button { padding: 3px 8px; border-radius: 6px; font-weight: 600; }
.toast button:hover { background: rgba(127, 127, 127, 0.2); }

/* Composer (floats on the pane, ADR 0020) */
.composer { padding: 0 36px 16px; flex-shrink: 0; }
.composer .col { gap: 0; }
.composer textarea {
  width: 100%; min-height: 60px; resize: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; outline: none; font-size: 14px;
}
.composer textarea:focus { border-color: var(--line-strong); }
.cluster { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 12px; }
.chip { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--text); text-align: left; }
.chip b { font-weight: 580; }
.chip span { display: block; color: var(--faint); font-size: 10px; }
.chip.is-on { background: var(--accent-dim); }
.hint { margin-left: auto; color: var(--faint); font-size: 12px; }

kbd, .k {
  display: inline-block; min-width: 18px; padding: 1px 5px; border-radius: 5px; text-align: center;
  border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel);
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.5;
}

.btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 12px; }
.btn:hover { background: var(--hover); }
.btn.solid { background: var(--text); color: var(--solid-fg); border-color: var(--text); }

/* Generic state gating: [data-show="a b"] is visible only when body[data-state] is a or b. */
[data-show][hidden] { display: none !important; }

/* Tooltip on action buttons (label + shortcut). */
.act { position: relative; }
.act[data-tt]:hover::after,
.act[data-tt].kb::after {
  content: attr(data-tt);
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  white-space: pre; padding: 4px 7px; border-radius: 6px; background: var(--text); color: var(--solid-fg);
  font-family: var(--font-ui); font-size: 11px; font-weight: 500; pointer-events: none; z-index: 10;
}
.act.kb { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--text); }

/* D · Right bubble (recommended): your turns hug the column's right edge at up to 80% width.
   Text stays left-aligned inside the bubble (ADR 0020). No "You" label; alignment says who spoke.
   The hover row aligns to the bubble's right edge: time, then verbs. */
.msg.u.rb { display: flex; flex-direction: column; align-items: flex-end; }
.msg.u.rb .bubble { width: fit-content; max-width: 80%; }
.msg.u.rb .acts.under { left: auto; right: -6px; }
.msg.u.rb .acts.under .stamp { margin-right: 4px; }
.msg.u.rb .acts.under .edited { margin-right: 2px; }
.msg.u.rb.focused::before { left: auto; right: -14px; }

  </style>
  <style>
    /* Transcript bits, as in WorkbenchThread ------------------------------ */
    .phase-line { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }
    .spin {
      width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong);
      border-top-color: var(--muted); animation: spin 0.9s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cursor {
      display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px;
      background: var(--muted); animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .tool {
      display: flex; align-items: center; gap: 8px; margin: 12px 0 0; padding: 7px 10px;
      border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: 12px;
    }
    .tool .dur { color: var(--faint); margin-left: auto; font-variant-numeric: tabular-nums; }
    .approval {
      margin-top: 12px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
      background: color-mix(in srgb, var(--warn) 7%, var(--panel)); border-radius: 12px; padding: 12px 14px;
      font-size: 13px;
    }
    .approval .k2 { color: var(--warn); font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
    .approval p { margin: 6px 0 10px; color: var(--muted); }
    .approval .row2 { display: flex; gap: 6px; }
    .stopped-mark {
      display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--faint); font-size: 12px;
    }
    .stopped-mark i { width: 8px; height: 8px; border-radius: 2px; background: var(--faint); }
    .stopped-mark .act { height: 24px; color: var(--muted); }
    .stopped-mark .act .lbl { display: inline; }
    .acts.done { margin-top: 10px; margin-left: -6px; }
    .acts.done .act { height: 24px; }

    /* Composer shell: the textarea sits in a box so controls can live inside it. */
    .composer { position: relative; }
    .cbox { position: relative; }
    .composer textarea { display: block; font-family: var(--font-ui); }
    .composer textarea:disabled { opacity: 0.55; }
    .cluster .phase { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
    .cluster .phase.live { color: var(--warn); }
    .tgl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .sw { width: 26px; height: 14px; border-radius: 999px; background: var(--accent); position: relative; }
    .sw i { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); }
    .hint kbd { font-size: 10px; padding: 0 4px; }

    /* Today's control, for the Before variant */
    .old-stop {
      margin-left: auto; padding: 5px 10px; border-radius: 6px; background: var(--hover);
      color: var(--text); font-weight: 500; font-size: 12px;
    }
    .old-stop[disabled] { color: var(--faint); cursor: default; }

    /* A · Morph: one round button in the composer's bottom-right corner ---- */
    body[data-variant="morph"] .composer textarea { padding-right: 56px; }
    .runbtn {
      position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; background: var(--text); color: var(--solid-fg);
      transition: background-color 140ms ease, color 140ms ease, transform 140ms ease, opacity 140ms ease;
    }
    .runbtn svg { width: 15px; height: 15px; grid-area: 1 / 1; transition: opacity 120ms ease, transform 160ms ease; }
    .runbtn .g-stop { opacity: 0; transform: scale(0.6); }
    .runbtn.is-run .g-send { opacity: 0; transform: scale(0.6) translateY(-4px); }
    .runbtn.is-run .g-stop { opacity: 1; transform: none; }
    .runbtn:hover { transform: scale(1.06); }
    .runbtn[aria-disabled="true"] { background: var(--hover); color: var(--faint); cursor: default; transform: none; }
    .runbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* A ring traces while the agent works, so the button itself carries "busy". */
    .runbtn .ring {
      position: absolute; inset: -4px; border-radius: 50%; opacity: 0; pointer-events: none;
      border: 1.5px solid transparent; border-top-color: var(--muted); border-right-color: var(--muted);
      transition: opacity 160ms ease;
    }
    .runbtn.is-run .ring { opacity: 1; animation: spin 1.1s linear infinite; }
    .runbtn.is-held .ring { animation-play-state: paused; border-top-color: var(--warn); border-right-color: var(--warn); }

    /* B · Cluster: Stop joins the live phase line, right end of the cluster */
    .stop-chip {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 4px 6px 4px 9px;
      border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text); font-size: 12px;
      font-weight: 500; animation: pop 160ms ease;
    }
    .stop-chip:hover { background: var(--hover); }
    .stop-chip .sq { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
    .stop-chip kbd { font-size: 10px; padding: 0 4px; }
    @keyframes pop { from { opacity: 0; transform: translateY(3px); } }

    /* C · Pill: floats over the transcript's bottom edge, centered on the column */
    .pill {
      position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-radius: 999px;
      background: var(--rail); border: 1px solid var(--line-strong); box-shadow: var(--shadow);
      color: var(--text); font-size: 12px; font-weight: 500; white-space: nowrap; z-index: 3;
      animation: rise 180ms ease;
    }
    .pill:hover { background: var(--hover); }
    .pill .sq { width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
    .pill .phase { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
    .pill kbd { font-size: 10px; padding: 0 4px; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }

    /* Tooltip shared by the new controls */
    .stop-chip { position: relative; }
    [data-tip2]:hover::after {
      content: attr(data-tip2); position: absolute; bottom: calc(100% + 8px); right: -4px;
      white-space: pre; padding: 4px 7px; border-radius: 6px; background: var(--text); color: var(--solid-fg);
      font-family: var(--font-ui); font-size: 11px; font-weight: 500; pointer-events: none; z-index: 10;
    }

    .states .lbl2 { color: var(--faint); font-size: 11px; }
    .composer .note { left: -26px; top: 18px; }
    [data-v][hidden] { display: none !important; }
    .live-region { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* Enter while running: a choice menu anchored to the run control ------- */
    .busy-menu {
      position: absolute; right: 0; bottom: calc(100% + 8px); width: 360px; max-width: 100%; padding: 6px;
      border-radius: 12px; border: 1px solid var(--line-strong); background: var(--rail); box-shadow: var(--shadow);
      z-index: 6; animation: pop 140ms ease;
    }
    .busy-menu .kicker {
      font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint); padding: 4px 8px 6px;
    }
    .busy-menu button {
      display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; width: 100%; text-align: left;
      padding: 8px 9px; border-radius: 8px;
    }
    .busy-menu button b { font-weight: 500; color: var(--text); }
    .busy-menu button small { color: var(--faint); font-size: 11px; line-height: 1.35; }
    .busy-menu button kbd { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
    .busy-menu button:hover, .busy-menu button.is-active { background: var(--hover); }
    .busy-menu button.is-now b { color: var(--warn); }

    /* Client-side queue: chips stacked above the input */
    .queue { display: flex; flex-direction: column; gap: 4px; }
    .queue:not(:empty) { margin-bottom: 6px; }
    .qchip {
      display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; border-radius: 10px;
      border: 1px dashed var(--line-strong); background: var(--panel); font-size: 13px; animation: pop 160ms ease;
    }
    .qchip .k3 {
      flex-shrink: 0; font-size: 10px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint);
    }
    .qchip .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .qchip .act { height: 24px; }
    .qchip .act .lbl { display: inline; }
    .qchip.paused { border-style: solid; border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
    .qchip.paused .k3 { color: var(--warn); }

    /* Interrupted (Send now) reads differently from Stopped: accent arrow, no Continue, faded tail. */
    .int-mark { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--accent); font-size: 12px; font-weight: 500; }
    .prose.faded p:last-child { -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 115%); mask-image: linear-gradient(180deg, #000 30%, transparent 115%); }

    /* Add to this run: the steer sits inside the running reply, where Hermes will read it. */
    .steer {
      margin-top: 10px; padding: 6px 10px; border-left: 2px solid var(--accent); border-radius: 0 8px 8px 0;
      background: var(--hover); color: var(--text); font-family: var(--font-ui); font-size: 13px;
    }
    .steer .k3 { margin-right: 6px; font-size: 10px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }

    .busy-menu .aq {
      display: flex; align-items: center; gap: 8px; margin: 4px 2px 0; padding: 8px 9px 4px;
      border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; cursor: pointer;
    }
    .busy-menu .aq span { margin-left: auto; color: var(--faint); font-size: 11px; }

    @media (prefers-reduced-motion: reduce) {
      .runbtn .ring, .spin { animation: none !important; }
      .runbtn svg, .pill, .stop-chip, .busy-menu, .qchip { transition: none; animation: none; }
    }
  </style>

  <script>
// Shared review controls for the message-actions study kit.
// Pages call study.init({ render }) and mark state buttons with data-state-go / data-variant-go.
// [data-show="a b"] is visible only in states a or b; [data-v="x y"] only in variants x or y.
(() => {
  const params = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (params.has("embed")) root.classList.add("embed");

  const safeGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } };

  let render = () => {};

  const gate = () => {
    const { state, variant } = document.body.dataset;
    document.querySelectorAll("[data-show]").forEach((el) => {
      el.hidden = !el.dataset.show.split(" ").includes(state);
    });
    document.querySelectorAll("[data-v]").forEach((el) => {
      if (!el.dataset.v.split(" ").includes(variant)) el.hidden = true;
      else if (!el.dataset.show) el.hidden = false;
    });
    document.querySelectorAll("[data-state-go]").forEach((b) => b.classList.toggle("is-on", b.dataset.stateGo === state));
    document.querySelectorAll("[data-variant-go]").forEach((b) => b.classList.toggle("is-on", b.dataset.variantGo === variant));
  };

  const apply = ({ state, variant } = {}) => {
    if (state) document.body.dataset.state = state;
    if (variant) document.body.dataset.variant = variant;
    render();
    gate();
  };

  const init = (opts = {}) => {
    render = opts.render || render;

    const themeBox = document.getElementById("theme");
    const light = params.get("theme") === "light"
      || (params.get("theme") !== "dark" && safeGet("boundary-chat-theme") === "light");
    root.classList.toggle("light", light);
    if (themeBox) {
      themeBox.checked = light;
      themeBox.addEventListener("change", () => {
        root.classList.toggle("light", themeBox.checked);
        safeSet("boundary-chat-theme", themeBox.checked ? "light" : "dark");
      });
    }
    document.getElementById("notes")?.addEventListener("change", (e) => {
      root.classList.toggle("notes-on", e.target.checked);
    });

    document.addEventListener("click", (e) => {
      const s = e.target.closest("[data-state-go]");
      if (s) apply({ state: s.dataset.stateGo });
      const v = e.target.closest("[data-variant-go]");
      if (v) apply({ variant: v.dataset.variantGo });
    });

    apply({ state: params.get("state") || undefined, variant: params.get("variant") || undefined });
  };

  window.study = { init, apply };
})();

  </script>
  <script>
    const $ = (id) => document.getElementById(id);
    const RUNNING = ["thinking", "streaming", "tool", "approval", "menu", "queued", "interrupted"];
    const SAMPLE = "Also make it work with Esc.";
    const FIRST_Q = "Why does the composer still show Stop when nothing is running?";
    const PARTIAL = `<p>The Stop button is rendered unconditionally in the composer cluster. It is wrapped in the composer's cancel primitive, which only disables it when idle, so it reads as a live control even when there is nothing to stop.</p><p>The fix is to render it only while a run is in flight`;
    const FULL = PARTIAL + `, and give the idle composer a send control in the same spot so the corner always holds one primary action.</p>`;
    const LATER_PARTIAL = `<p>Done. Esc now stops the run when no popover is open; with the mention list open it closes the list first`;
    const LATER_FULL = LATER_PARTIAL + `. The handler lives on the chat pane, so it works even when focus is in the transcript.</p>`;

    const phaseText = {
      thinking: "Thinking · 3s",
      streaming: "Generating · 38 tok/s · 0:07",
      tool: "read_file · turn 2 of 8",
      approval: "Waiting for approval",
    };
    const MENU = [
      { id: "now", label: "Send now", sub: "Stops Hermes and sends this. What it wrote so far is kept.", key: "⌘↵" },
      { id: "add", label: "Add to this run", sub: "Hermes reads it after its current step, without stopping.", key: "⌥↵" },
      { id: "queue", label: "Queue", sub: "Sends when Hermes finishes this reply.", key: "↵" },
      { id: "cancel", label: "Keep editing", sub: "Closes this menu. Your message stays here.", key: "esc" },
    ];
    const QUEUE_IDX = 2;

    // Mock session: finished turns, the live prompt (null for a hidden Continue), the client-side queue.
    let turns = "";
    let liveUser = FIRST_Q;
    let turnNo = 0;
    let queue = [];
    let paused = false;
    let steers = [];
    let alwaysQueue = (() => { try { return localStorage.getItem("stopstudy-always-queue") === "1"; } catch { return false; } })();
    let menuOpen = false;
    let menuIdx = QUEUE_IDX; // Queue is the default: Enter twice must never kill a run.
    let lastSendAt = 0;
    let timers = [];
    const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
    const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const userBubble = (t) => `<div class="msg u rb"><div class="bubble">${esc(t)}</div></div>`;
    const partialText = () => (turnNo === 0 ? PARTIAL : LATER_PARTIAL);
    const fullText = () => (turnNo === 0 ? FULL : LATER_FULL);
    const doneActs = `<div class="acts done"><button class="act"><svg><use href="#i-copy" /></svg></button><button class="act"><svg><use href="#i-retry" /></svg></button><span class="stamp" style="margin-left:4px">2:41 PM</span></div>`;
    const steerHtml = () => steers.map((t) => `<div class="steer"><span class="k3">You added</span>${esc(t)}</div>`).join("");
    const interruptedReply = () => replyWrap(`<div class="prose faded">${partialText()}…</p></div>${steerHtml()}<div class="int-mark">↳ Interrupted by your next message</div>`);
    const replyWrap = (inner) => `<div class="msg a"><div class="who">Hermes</div>${inner}</div>`;

    const replyHtml = (s) => {
      const S = ["menu", "queued", "interrupted"].includes(s) ? "streaming" : s;
      if (S === "thinking") return `<div class="who">Hermes</div><div class="phase-line"><i class="spin"></i>Thinking · 3s</div>${steerHtml()}`;
      if (S === "streaming") return `<div class="who">Hermes</div><div class="prose">${partialText()}<span class="cursor"></span></p></div>${steerHtml()}`;
      if (S === "tool") return `<div class="who">Hermes</div><div class="prose"><p>Let me check how the composer renders it.</p></div><div class="tool"><i class="spin"></i><span class="mono">read_file</span> src/renderer/product/chat/WorkbenchThread.tsx<span class="dur">1.4s</span></div>${steerHtml()}`;
      if (S === "approval") return `<div class="who">Hermes</div><div class="prose"><p>I can patch this directly.</p></div><div class="approval"><div class="k2">Approval needed</div><p>Hermes wants to write <span class="mono">workbench.css</span>.</p><div class="row2"><button class="btn solid">Allow once</button><button class="btn">Deny</button></div></div>`;
      if (S === "stopped") return `<div class="who">Hermes</div><div class="prose">${partialText()}…</p></div><div class="stopped-mark"><i></i>Stopped by you · 0:07<button class="act" type="button" data-act="continue"><svg><use href="#i-play" /></svg><span class="lbl">Continue</span></button><button class="act" type="button" data-act="retry"><svg><use href="#i-retry" /></svg><span class="lbl">Retry</span></button></div>`;
      return `<div class="who">Hermes</div><div class="prose">${fullText()}</div>${doneActs}`;
    };

    const stopTip = (s) => s === "approval" ? "Stop · denies the pending request\nEsc" : queue.length ? "Stop · pauses your queue\nEsc" : "Stop\nEsc";

    function render() {
      const s = document.body.dataset.state;
      const v = document.body.dataset.variant;
      const running = RUNNING.includes(s);
      const input = $("input");

      // Review-bar shortcuts seed the composer / queue so each state is legible on its own.
      if ((s === "typed" || s === "menu") && !input.value) input.value = SAMPLE;
      if (s === "menu") menuOpen = true;
      if (s === "queued" && !queue.length) queue = [SAMPLE];
      if (s === "interrupted" && !turns) {
        turns = userBubble(FIRST_Q) + interruptedReply();
        liveUser = SAMPLE;
        turnNo = 1;
      }
      if (!running) menuOpen = false; // run ended under the menu: close it, keep the draft

      $("turns").innerHTML = turns;
      $("live-user").innerHTML = liveUser ? userBubble(liveUser) : "";
      $("reply").innerHTML = replyHtml(s);
      document.querySelector(".log").scrollTop = 1e9;
      input.disabled = s === "approval";
      input.placeholder = s === "approval" ? "Answer the approval to continue…" : running ? (alwaysQueue ? "Enter queues · ⌘↵ sends now · ⌥↵ adds to this run" : "Draft your next message… Enter asks what to do with it") : "Message Hermes…";

      const ph = phaseText[["menu", "queued", "interrupted"].includes(s) ? "streaming" : s];
      $("phase").textContent = v === "pill" || !running ? "" : ph;
      $("phase").className = "phase" + (running ? " live" : "");

      // A · Morph
      const btn = $("runbtn");
      const hasText = input.value.trim().length > 0;
      btn.classList.toggle("is-run", running);
      btn.classList.toggle("is-held", s === "approval");
      btn.setAttribute("aria-label", running ? "Stop response" : "Send message");
      btn.setAttribute("aria-disabled", String(!running && !hasText));
      btn.dataset.tip2 = running ? stopTip(s) : hasText ? "Send\nEnter" : "";
      if (!btn.dataset.tip2) delete btn.dataset.tip2;

      // B · Cluster / Today
      const right = $("right-slot");
      if (v === "cluster") {
        right.innerHTML = running
          ? `<button class="stop-chip" type="button" data-act="stop" data-tip2="${stopTip(s)}"><span class="sq"></span>Stop <kbd>esc</kbd></button>`
          : `<span class="hint"><kbd>↵</kbd> send</span>`;
      } else if (v === "before") {
        right.innerHTML = `<button class="old-stop" type="button" data-act="stop" ${running ? "" : "disabled"}>Stop</button>`;
      } else right.innerHTML = "";

      // C · Pill
      $("pill-slot").innerHTML = v === "pill" && running
        ? `<button class="pill" type="button" data-act="stop" data-tip2="${stopTip(s)}"><span class="sq"></span>Stop <span class="phase">· ${ph}</span> <kbd>esc</kbd></button>`
        : "";

      // Queue chips: dashed while waiting, amber and solid when a Stop paused them.
      $("queue").innerHTML = queue.map((t, i) => `
        <div class="qchip${paused ? " paused" : ""}">
          <span class="k3">${paused ? "Paused" : i === 0 ? "Next" : `Queued ${i + 1}`}</span>
          <span class="txt">${esc(t)}</span>
          ${i === 0 && (paused || running) ? `<button class="act" type="button" data-q="send" data-i="${i}"><svg><use href="#i-send" /></svg><span class="lbl">Send now</span></button>` : ""}
          ${i === 0 && running && !paused ? `<button class="act" type="button" data-q="add" data-i="${i}"><span class="lbl">Add to run</span></button>` : ""}
          <button class="act" type="button" data-q="edit" data-i="${i}"><span class="lbl">Edit</span></button>
          <button class="act" type="button" data-q="drop" data-i="${i}" aria-label="Remove from queue">×</button>
        </div>`).join("");

      // Enter-while-running menu
      $("menu-slot").innerHTML = menuOpen && running ? `
        <div class="busy-menu" role="menu" aria-label="Hermes is still replying">
          <div class="kicker">Hermes is still replying</div>
          ${MENU.map((m, i) => `
            <button type="button" role="menuitem" data-menu="${m.id}" class="${i === menuIdx ? "is-active" : ""}${m.id === "now" ? " is-now" : ""}">
              <b>${m.label}</b><kbd>${m.key}</kbd><small>${m.sub}</small>
            </button>`).join("")}
          <label class="aq"><input type="checkbox" id="aq" ${alwaysQueue ? "checked" : ""} /> Always queue · don't ask<span>Settings → Chat</span></label>
        </div>` : "";
    }

    const go = (state) => study.apply({ state });

    function startRun() {
      clearTimers();
      lastSendAt = Date.now();
      paused = false;
      menuOpen = false;
      steers = [];
      go("thinking");
      timers.push(setTimeout(() => go("tool"), 1200));
      timers.push(setTimeout(() => go("streaming"), 2600));
      timers.push(setTimeout(finishRun, 7000));
    }
    // A finished run drains the client-side queue (sent with queued:true so Hermes never treats it as a correction).
    function finishRun() {
      if (queue.length && !paused) {
        turns += (liveUser ? userBubble(liveUser) : "") + replyWrap(`<div class="prose">${fullText()}</div>${steerHtml()}${doneActs}`);
        liveUser = queue.shift();
        turnNo++;
        startRun();
      } else go("idle");
    }
    function send(text) {
      if (!text.trim()) return;
      const s = document.body.dataset.state;
      // The finished (or stopped) reply moves into history before the new turn starts.
      turns += (liveUser ? userBubble(liveUser) : "") + replyWrap(s === "stopped"
        ? `<div class="prose">${partialText()}…</p></div><div class="stopped-mark"><i></i>Stopped by you · 0:07</div>`
        : `<div class="prose">${fullText()}</div>${steerHtml()}${doneActs}`);
      liveUser = text.trim();
      turnNo++;
      startRun();
    }
    function sendNow(fromQueue) {
      // Spec decision 1: session.interrupt, wait for Hermes to confirm, then a normal send. Hermes keeps the partial.
      const text = fromQueue ?? $("input").value.trim();
      if (fromQueue == null) $("input").value = "";
      turns += (liveUser ? userBubble(liveUser) : "") + interruptedReply();
      liveUser = text;
      turnNo++;
      startRun();
      $("input").focus();
    }
    function enqueue() {
      queue.push($("input").value.trim());
      $("input").value = "";
      menuOpen = false;
      settle();
      $("live").textContent = "Queued. Sends when Hermes finishes.";
      $("input").focus();
    }
    function addToRun(fromQueue) {
      // session.steer: Hermes reads it after its current step; a rejected steer would fall back to the queue.
      steers.push(fromQueue ?? $("input").value.trim());
      if (fromQueue == null) $("input").value = "";
      menuOpen = false;
      settle();
      $("live").textContent = "Added to this run.";
      $("input").focus();
    }
    // Leave the review-only states once the user acts, so their seeds don't re-fire.
    const settle = () => (["menu", "queued", "interrupted"].includes(document.body.dataset.state) ? go("streaming") : render());
    function closeMenu() { menuOpen = false; settle(); $("input").focus(); }
    function choose(id) { if (id === "now") sendNow(); else if (id === "add") addToRun(); else if (id === "queue") enqueue(); else closeMenu(); }

    function stopRun() {
      // Guard: a double-click on Send must not land as Stop on the second click.
      if (Date.now() - lastSendAt < 350) return;
      clearTimers();
      menuOpen = false;
      // session.interrupt clears Hermes's own queue, so the queue lives in the client and pauses here.
      if (queue.length) paused = true;
      go("stopped");
      $("live").textContent = queue.length ? "Response stopped. Your queue is paused." : "Response stopped";
      $("input").focus();
    }

    $("runbtn").addEventListener("click", () => {
      const running = RUNNING.includes(document.body.dataset.state);
      if (running) stopRun();
      else if ($("input").value.trim()) { const t = $("input").value; $("input").value = ""; send(t); }
    });
    document.addEventListener("click", (e) => {
      if (e.target.closest('[data-act="stop"]')) stopRun();
      const m = e.target.closest("[data-menu]");
      if (m) choose(m.dataset.menu);
      if (e.target.closest('[data-act="continue"]')) {
        // Continue = a hidden prompt.submit (display_kind "hidden"): no user bubble, the agent picks up from its saved partial.
        turns += (liveUser ? userBubble(liveUser) : "") + replyWrap(`<div class="prose">${partialText()}…</p></div>`);
        liveUser = null;
        startRun();
      }
      if (e.target.closest('[data-act="retry"]')) startRun();
      const q = e.target.closest("[data-q]");
      if (q) {
        const running = RUNNING.includes(document.body.dataset.state);
        const i = Number(q.dataset.i);
        const [t] = queue.splice(i, 1);
        if (q.dataset.q === "edit") { $("input").value = t + ($("input").value ? "\n" + $("input").value : ""); $("input").focus(); }
        if (q.dataset.q === "send") (running && !paused ? sendNow(t) : send(t));
        if (q.dataset.q === "add") steers.push(t);
        if (!queue.length) paused = false;
        settle();
      }
      if (menuOpen && !e.target.closest(".busy-menu") && !e.target.closest("[data-state-go]")) closeMenu();
    });
    document.addEventListener("change", (e) => {
      if (e.target.id !== "aq") return;
      alwaysQueue = e.target.checked;
      try { localStorage.setItem("stopstudy-always-queue", alwaysQueue ? "1" : "0"); } catch { /* private window */ }
      render();
    });
    $("input").addEventListener("input", () => {
      if (document.body.dataset.state === "typed" && !$("input").value) document.body.dataset.state = "idle";
      if (document.body.dataset.state === "idle" && $("input").value) document.body.dataset.state = "typed";
      render();
      document.querySelectorAll("[data-state-go]").forEach((b) => b.classList.toggle("is-on", b.dataset.stateGo === document.body.dataset.state));
    });
    $("input").addEventListener("keydown", (e) => {
      const running = RUNNING.includes(document.body.dataset.state);
      if (running && e.key === "Enter" && $("input").value.trim()) {
        if (e.metaKey || e.ctrlKey) { e.preventDefault(); choose("now"); return; }
        if (e.altKey) { e.preventDefault(); choose("add"); return; }
      }
      if (menuOpen && running) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          menuIdx = (menuIdx + (e.key === "ArrowDown" ? 1 : MENU.length - 1)) % MENU.length;
          render();
          return;
        }
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); choose("now"); return; }
        if (e.key === "Enter") { e.preventDefault(); choose(MENU[menuIdx].id); return; }
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(); return; }
      }
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!$("input").value.trim()) return;
        if (running) { if (alwaysQueue) enqueue(); else { menuOpen = true; menuIdx = QUEUE_IDX; render(); } }
        else { const t = $("input").value; $("input").value = ""; send(t); }
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.defaultPrevented) return;
      if (e.key === "Escape" && RUNNING.includes(document.body.dataset.state)) { e.preventDefault(); stopRun(); }
    });
    // Review-bar jumps reset the mock session.
    document.querySelectorAll("[data-state-go]").forEach((b) => b.addEventListener("click", () => {
      clearTimers();
      turns = ""; liveUser = FIRST_Q; turnNo = 0; queue = []; steers = []; paused = false; menuOpen = false; menuIdx = QUEUE_IDX;
      $("input").value = "";
    }));

    study.init({ render });
  </script>
</body>
</html>
