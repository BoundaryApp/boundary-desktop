<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
/* Values from src/renderer/styles/tokens.css; frame after the shared folders prototype. */
:root {
  --s0:#0d0d0f; --rail:#111113; --s1:#161618; --s2:#1c1c22; --hover:#1d1d22; --line:#2a2a30; --line2:#3a3a44;
  --tx:#f5f5f7; --mut:#c4c4cc; --fnt:#9e9ea8; --brand:#8b87f8; --brandd:#26244a; --solid:#f5f5f7; --solidfg:#111;
  --ok:#86c089; --okd:#17251a; --warn:#e8c27a; --warnd:#2a2415; --warnl:#5a4a2a; --dng:#e8a0a0; --dngd:#2a1717; --dngl:#5a3030;
  --pop:0 12px 32px rgb(0 0 0 / .35); --overlay:0 18px 48px rgb(0 0 0 / .45); --page:#050506; --scrim:rgb(0 0 0 / .5);
}
:root[data-theme="light"] {
  --s0:#f3f1ea; --rail:#ece8dc; --s1:#fffcf6; --s2:#f7f4ec; --hover:#ece8dc; --line:#e3dfd3; --line2:#cfc9b8;
  --tx:#1c1b17; --mut:#6d6a60; --fnt:#9a968a; --brand:#5b56d6; --brandd:#e6e4fb; --solid:#1c1b17; --solidfg:#fffcf6;
  --ok:#3f7d44; --okd:#e3f0e2; --warn:#8a6415; --warnd:#f6ecd6; --warnl:#e3cf9f; --dng:#a83a3a; --dngd:#f8e4e1; --dngl:#e2b4b4;
  --pop:0 12px 32px rgb(40 32 16 / .12); --overlay:0 18px 48px rgb(40 32 16 / .16); --page:#d9d5c8; --scrim:rgb(40 32 16 / .25);
}
* { box-sizing:border-box }
body { margin:0; background:var(--page); color:var(--tx); font:13px/1.45 'IBM Plex Sans',system-ui,sans-serif }
button, input, textarea { font:inherit; color:inherit }
button { cursor:pointer }
.mono { font-family:'IBM Plex Mono',monospace; font-size:12px }

.bar { position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:10px 16px; background:var(--s1); border-bottom:1px solid var(--line) }
.bar b { font-weight:500; margin-right:6px }
.bar .sep { width:1px; height:20px; background:var(--line); margin:0 6px }
.chip { height:28px; padding:0 10px; border:1px solid var(--line); border-radius:999px; background:none; color:var(--mut); font-size:12px }
.chip[aria-pressed="true"] { background:var(--brandd); border-color:var(--brand); color:var(--tx) }
.note { width:100%; margin:4px 0 0; font-size:12px; color:var(--fnt) }
.stage { padding:20px 16px 40px; display:flex; justify-content:center }
.fit { transform-origin:top left }

.app { position:relative; width:1280px; height:800px; overflow:hidden; display:flex; background:var(--s0); border-radius:10px; box-shadow:var(--overlay) }
.rail { width:56px; flex-shrink:0; background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:44px }
.rail .ic { width:36px; height:36px; border:0; border-radius:8px; background:none; display:flex; align-items:center; justify-content:center; color:var(--fnt) }
.rail .ic.on { background:var(--brandd); color:var(--brand) }
.rail .grow { flex:1 }

.left { width:248px; flex-shrink:0; background:var(--s1); border-right:1px solid var(--line); display:flex; flex-direction:column; padding-top:38px; overflow:auto }
.sect { padding:12px 8px 4px 16px; font-size:12px; color:var(--fnt) }
.r { display:flex; align-items:center; gap:8px; width:calc(100% - 16px); margin:1px 8px; padding:6px 8px; border:0; border-radius:7px; background:none; color:var(--mut); text-align:left }
.r:hover, .r.on { background:var(--hover); color:var(--tx) }
.r .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.r small { color:var(--fnt); font-size:11px }
.av { width:20px; height:20px; flex-shrink:0; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:600; color:#fff }

main.center { flex:1; min-width:0; display:flex; flex-direction:column; position:relative }
.head { display:flex; align-items:center; gap:10px; height:64px; flex-shrink:0; padding:20px 24px 0; border-bottom:1px solid var(--line) }
.head .ttl { flex:1; min-width:0; display:flex; flex-direction:column; padding-bottom:12px }
.head strong { font-weight:500; font-size:14px }
.head small { font-size:12px; color:var(--fnt) }
.head .right { display:flex; gap:8px; padding-bottom:12px }
.btn { height:30px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:none; color:var(--mut); font-size:12px; white-space:nowrap }
.btn:hover { border-color:var(--line2); color:var(--tx) }
.btn.solid { border:0; background:var(--solid); color:var(--solidfg); font-weight:500 }
.btn.danger { border-color:var(--dngl); color:var(--dng) }
.btn.sm { height:26px; padding:0 9px }
.btn:disabled { opacity:.45; cursor:default }
.scroll { flex:1; min-height:0; overflow:auto; padding:12px 0 24px }
.col { max-width:760px; margin:0 auto; padding:0 32px }

/* Settings */
.snav .r { font-size:13px }
.lede { margin:18px 0 14px; color:var(--mut); max-width:600px }
.vcard { border:1px solid var(--line); border-radius:10px; background:var(--s1); padding:14px 16px; margin-bottom:10px }
.vcard .top { display:flex; align-items:center; gap:10px }
.vcard .nm { flex:1; display:flex; flex-direction:column; line-height:1.35 }
.vcard .nm b { font-weight:500; font-size:14px }
.vcard .nm small { color:var(--fnt); font-size:12px }
.badge { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:999px; font-size:11.5px; border:1px solid var(--line); color:var(--mut) }
.badge.ok { color:var(--ok); border-color:transparent; background:var(--okd) }
.badge.warn { color:var(--warn); border-color:var(--warnl); background:var(--warnd) }
.badge.run { color:var(--brand); border-color:transparent; background:var(--brandd) }
.desc { margin:10px 0 0; font-family:'Source Serif 4',Georgia,serif; font-size:14.5px; line-height:1.6; color:var(--tx) }
.kicker { margin:14px 0 6px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--fnt) }
.never { margin:0; padding:0; list-style:none }
.never li { display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--line); color:var(--mut) }
.never li:first-child { border-top:0 }
.never input { flex:1; height:28px; padding:0 8px; border:1px solid var(--line); border-radius:6px; background:var(--s0) }
.never .x { width:24px; height:24px; border:0; background:none; color:var(--fnt); border-radius:6px }
.never .x:hover { background:var(--hover); color:var(--tx) }
.row { display:flex; align-items:center; gap:8px; margin-top:12px }
.row .sp { flex:1 }
.meta { font-size:12px; color:var(--fnt) }
.steps { margin:10px 0 0; padding:0; list-style:none }
.steps li { display:flex; align-items:center; gap:8px; padding:3px 0; color:var(--fnt); font-size:12.5px }
.steps li.done { color:var(--mut) }
.steps li.now { color:var(--tx) }
.dot { width:8px; height:8px; border-radius:50%; border:1px solid var(--fnt) }
.done .dot { background:var(--ok); border-color:var(--ok) }
.now .dot { background:var(--brand); border-color:var(--brand); animation:pulse 1s infinite alternate }
@keyframes pulse { to { opacity:.35 } }
@media (prefers-reduced-motion: reduce) { .now .dot { animation:none } }

/* Sheet */
.scrim { position:absolute; inset:0; z-index:30; background:var(--scrim); display:flex; align-items:center; justify-content:center }
.sheet { width:520px; max-height:740px; overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--s1); box-shadow:var(--overlay); padding:20px 22px }
.sheet h2 { margin:0 0 4px; font-size:16px; font-weight:500 }
.sheet .sub { margin:0 0 14px; color:var(--fnt); font-size:12.5px }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px }
.field > span { font-size:12px; color:var(--mut) }
.field input, .field textarea { height:32px; padding:0 10px; border:1px solid var(--line); border-radius:7px; background:var(--s0) }
.field textarea { height:72px; padding:8px 10px; resize:none }
.field small { font-size:11.5px; color:var(--fnt) }
.drop { border:1px dashed var(--line2); border-radius:10px; padding:14px; text-align:center; color:var(--fnt); font-size:12.5px }
.drop .row { justify-content:center; margin-top:8px }
.files { margin:10px 0 0; padding:0; list-style:none; border:1px solid var(--line); border-radius:8px }
.files li { display:flex; align-items:center; gap:8px; padding:6px 10px; border-top:1px solid var(--line); font-size:12.5px }
.files li:first-child { border-top:0 }
.files .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.files small { color:var(--fnt); font-size:11.5px }
.files .warn { color:var(--warn) }
.files .off { color:var(--fnt); text-decoration:line-through }
.meter { margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--s2) }
.meter .bar2 { height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin:7px 0 6px }
.meter .bar2 i { display:block; height:100%; background:var(--ok) }
.meter .nums { display:flex; gap:16px; font-size:12px; color:var(--mut) }
.meter p { margin:6px 0 0; font-size:11.5px; color:var(--fnt) }
.foot { display:flex; align-items:center; gap:8px; margin-top:16px }
.foot .sp { flex:1 }
.picker { display:flex; align-items:center; justify-content:space-between; height:32px; padding:0 10px; border:1px solid var(--line); border-radius:7px; background:var(--s0); color:var(--tx) }
.picker .chev { color:var(--fnt) }
.group { border:1px solid var(--line); border-radius:9px; padding:12px 12px 0; margin-bottom:14px }
.group > b { display:block; font-weight:500; font-size:12.5px; margin-bottom:10px }

/* Thread */
.msg { display:flex; gap:10px; margin:16px 0 }
.msg .who { font-size:12px; color:var(--fnt); margin-bottom:3px }
.msg .who b { color:var(--tx); font-weight:500 }
.prose { font-family:'Source Serif 4',Georgia,serif; font-size:15.5px; line-height:1.7 }
.prose p { margin:0 0 10px }
.mine { margin:16px 0 16px auto; max-width:520px; padding:9px 13px; border-radius:12px; background:var(--s2); border:1px solid var(--line) }
.mine .vtag { display:inline-flex; align-items:center; gap:4px; margin-right:6px; padding:1px 7px; border-radius:999px; background:var(--brandd); color:var(--brand); font-size:11.5px }
.details { font-size:11.5px; color:var(--fnt) }
.details span + span::before { content:"·"; margin:0 6px }
.mark { display:flex; align-items:center; gap:10px; margin:14px 0; font-size:11.5px; color:var(--fnt) }
.mark::before, .mark::after { content:""; flex:1; height:1px; background:var(--line) }

.composer { margin:0 auto 18px; width:calc(100% - 64px); max-width:760px; position:relative }
.box { border:1px solid var(--line2); border-radius:12px; background:var(--s1); padding:10px 12px 8px }
.input { min-height:44px; display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px; font-size:14px; color:var(--tx) }
.input .ph { color:var(--fnt) }
.caret { display:inline-block; width:1px; height:18px; background:var(--tx); vertical-align:-3px; animation:blink 1s steps(1) infinite }
@keyframes blink { 50% { opacity:0 } }
@media (prefers-reduced-motion: reduce) { .caret { animation:none } }
.vchip { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 8px; border-radius:6px; background:var(--brandd); color:var(--tx); font-size:12.5px }
.vchip .pin { width:18px; height:18px; border:0; border-radius:4px; background:none; color:var(--fnt); display:inline-flex; align-items:center; justify-content:center }
.vchip .pin:hover { color:var(--brand); background:var(--hover) }
.tools { display:flex; align-items:center; gap:6px; margin-top:6px }
.tools .sp { flex:1 }
.fchip { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border:1px solid var(--line); border-radius:999px; background:none; color:var(--mut); font-size:12px }
.fchip.v { border-color:var(--brand); color:var(--tx) }
.send { width:30px; height:30px; border:0; border-radius:8px; background:var(--solid); color:var(--solidfg) }

.cmenu { position:absolute; left:0; bottom:calc(100% + 6px); width:420px; padding:5px; border:1px solid var(--line); border-radius:10px; background:var(--s1); box-shadow:var(--pop); z-index:10 }
.cmenu .h { padding:6px 8px 4px; font-size:11px; color:var(--fnt) }
.cmenu button.o { display:flex; align-items:center; gap:10px; width:100%; padding:6px 8px; border:0; border-radius:7px; background:none; text-align:left }
.cmenu button.o.is-active { background:var(--hover) }
.cmenu .pt { flex:1; display:flex; flex-direction:column; line-height:1.3 }
.cmenu .pt small { font-size:11.5px; color:var(--fnt) }
.cmenu .tag { font-size:11px; color:var(--fnt) }
.cmenu .keys { display:flex; gap:12px; padding:6px 8px 3px; border-top:1px solid var(--line); margin-top:4px; font-size:11px; color:var(--fnt) }
.cmenu .keys kbd { font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:0 4px; border:1px solid var(--line); border-radius:4px; color:var(--mut) }
.cmenu hr { border:0; border-top:1px solid var(--line); margin:4px 0 }
.cmenu .link { color:var(--mut) }
.fmenu { left:auto; right:120px; width:260px }

.insp { width:300px; flex-shrink:0; border-left:1px solid var(--line); background:var(--s1); padding:44px 16px 16px; overflow:auto }
.insp .ident { display:flex; align-items:center; gap:9px; margin-bottom:14px }
.insp .ident .av { width:28px; height:28px; font-size:11px }
.insp .ident b { font-weight:500 }
.insp .ident small { display:block; color:var(--fnt); font-size:11.5px }
.insp p { margin:0 0 10px; color:var(--mut); font-size:12.5px }
.kv { display:grid; grid-template-columns:96px 1fr; gap:6px 10px; font-size:12.5px; margin-bottom:12px }
.kv dt { color:var(--fnt) }
.kv dd { margin:0; color:var(--tx) }

.dialog { width:440px }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Scenes">
  <b>Writing voices</b>
  <span id="scenes"></span>
  <span class="sep"></span>
  <button class="chip" id="theme" type="button">Light</button>
  <p class="note">Click-through, not the app. Names, samples and numbers are made up. <span class="mono">?start=</span> opens a scene: voices, create, calibrating, card, agent, slash, chip, kept, delete.</p>
</div>
<div class="stage"><div class="fit" id="fit"><div class="app" id="app"></div></div></div>

<script>
const SCENES = [
  ['voices', 'Library'], ['create', 'Create'], ['calibrating', 'Calibrating'], ['card', 'Voice card'],
  ['agent', 'Agent sheet'], ['slash', '/ menu'], ['chip', 'Message chip'], ['kept', 'Kept for chat'], ['delete', 'Delete'],
];
const VOICES = [
  { id: 'newsletter', name: 'Newsletter', desc: 'Long, unhurried, first person', pieces: 9, words: '11,240', date: '9 Nov', status: 'ready' },
  { id: 'working', name: 'Plain working', desc: 'Short, direct, no preamble', pieces: 14, words: '6,310', date: '4 Nov', status: 'ready' },
  { id: 'blog', name: 'Company blog', desc: 'Warm, second person, concrete', pieces: 6, words: '5,020', date: '28 Oct', status: 'changed' },
];
const NEVER = [
  'Never opens with a question',
  'Never uses exclamation marks',
  'Never ends on a summary of what was just said',
  'Never uses bulleted lists inside a piece',
];
const I = {
  chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  circles: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>',
  chipI: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>',
  grid: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>',
  gauge: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>',
  gear: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
  pen: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg>',
  pin: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg>',
  up: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

let scene = new URLSearchParams(location.search).get('start') || 'voices';
if (!SCENES.some(([id]) => id === scene)) scene = 'voices';
let menuIndex = 0;
let editing = false;
let calStep = 0;
let calTimer = null;

function rail(on) {
  const ic = (k, label, svg) => `<button class="ic ${on === k ? 'on' : ''}" type="button" aria-label="${label}" title="${label}" data-go="${k === 'chat' ? 'kept' : k === 'settings' ? 'voices' : ''}">${svg}</button>`;
  return `<nav class="rail" aria-label="App">${ic('chat', 'Chat', I.chat)}${ic('', 'Circles', I.circles)}${ic('', 'Inference', I.chipI)}${ic('', 'Services', I.grid)}${ic('', 'Resources', I.gauge)}<span class="grow"></span>${ic('settings', 'Settings', I.gear)}<span style="height:12px"></span></nav>`;
}

function settingsNav() {
  const items = ['Assistant', 'Inference', 'Reply text', 'Writing voices', 'Coding folders', 'Calendars', 'Passwords and logins', 'Updates'];
  return `<aside class="left snav"><div class="sect">Settings</div>${items.map((t) => `<button class="r ${t === 'Writing voices' ? 'on' : ''}" type="button"><span class="t">${t}</span></button>`).join('')}</aside>`;
}

function badge(v) {
  if (v.status === 'ready') return '<span class="badge ok">Ready</span>';
  if (v.status === 'changed') return '<span class="badge warn">Samples changed</span>';
  return '<span class="badge run">Calibrating</span>';
}

function voiceRow(v) {
  return `<div class="vcard"><div class="top"><span class="nm"><b>${esc(v.name)}</b><small>${esc(v.desc)} · ${v.pieces} pieces, ${v.words} words · calibrated ${v.date}</small></span>${badge(v)}
    ${v.status === 'changed' ? '<button class="btn sm" type="button" data-go="calibrating">Recalibrate</button>' : `<button class="btn sm" type="button" data-go="card">Open</button>`}</div></div>`;
}

function calibratingCard() {
  const steps = ['Copying 7 samples', 'Measuring sentences and punctuation', 'Reading the samples', 'Writing the style guide', 'Checking the style guide'];
  return `<div class="vcard"><div class="top"><span class="nm"><b>Field notes</b><small>7 pieces, 6,880 words · calibrating with Qwen3 32B on this Mac</small></span><span class="badge run">Calibrating</span></div>
    <ul class="steps">${steps.map((s, i) => `<li class="${i < calStep ? 'done' : i === calStep ? 'now' : ''}"><span class="dot"></span>${s}</li>`).join('')}</ul>
    <p class="meta" style="margin:8px 0 0">You can leave this page. The voice can be picked once it's ready.</p></div>`;
}

function readyCard() {
  const list = editing
    ? NEVER.map((n) => `<li><input value="${esc(n)}" aria-label="Never does"><button class="x" type="button" aria-label="Remove">×</button></li>`).join('') + '<li><input placeholder="Never …" aria-label="New line"></li>'
    : NEVER.map((n) => `<li>${esc(n)}</li>`).join('');
  return `<div class="vcard"><div class="top"><span class="nm"><b>Field notes</b><small>7 pieces, 6,880 words · calibrated today · STYLE.md 4,210 characters</small></span><span class="badge ok">Ready</span></div>
    <p class="desc">Writes like someone thinking aloud on a long walk: concrete detail first, the point arrives late and plainly. Long sentences broken by four-word stops. First person throughout, warm toward the reader without addressing them.</p>
    <div class="kicker">Never does</div><ul class="never">${list}</ul>
    <div class="row">${editing ? '<button class="btn solid sm" type="button" data-act="save">Save</button><button class="btn sm" type="button" data-act="edit">Cancel</button>' : '<button class="btn sm" type="button" data-act="edit">Edit</button>'}
      <button class="btn sm" type="button">Open STYLE.md</button><button class="btn sm" type="button">Samples (7)</button><span class="sp"></span>
      <button class="btn sm" type="button">Show in Finder</button><button class="btn sm danger" type="button" data-go="delete">Delete…</button></div>
    <p class="meta" style="margin:10px 0 0">Used by Juniper for chat replies and Marlow for drafts.</p></div>`;
}

function settingsCenter(extraTop) {
  return `<main class="center"><div class="head"><span class="ttl"><strong>Writing voices</strong><small>Agents write in these, set per agent or picked for a message</small></span><span class="right"><button class="btn solid" type="button" data-go="create">New voice…</button></span></div>
    <div class="scroll"><div class="col"><p class="lede">Each voice is calibrated from samples of someone's writing. Agents use it for chat replies, drafts, or both, as set on each agent. Type <span class="mono">/</span> in the composer to pick one for a single message.</p>
    ${extraTop || ''}${VOICES.map(voiceRow).join('')}</div></div></main>`;
}

function createSheet() {
  const files = [
    ['walking-to-work.md', '1,420 words', ''], ['on-repair.md', '1,180 words', ''], ['the-allotment.md', '960 words', ''],
    ['letters-home.txt', '1,640 words', ''], ['winter-list.md', '610 words', 'Mostly headers and lists'],
    ['kitchen-radio.md', '540 words', ''], ['short-one.md', '530 words', ''], ['scan-2019.pdf', '', 'Not added: PDF'],
  ];
  return `<div class="scrim"><div class="sheet" role="dialog" aria-label="New writing voice"><h2>New writing voice</h2>
    <p class="sub">Finished pieces you'd publish again work best. Agents imitate everything in the samples.</p>
    <label class="field"><span>Name</span><input value="Field notes"></label>
    <div class="drop">Drop .md, .txt or .rst files here<div class="row"><button class="btn sm" type="button">Choose files…</button><button class="btn sm" type="button">Paste text</button></div></div>
    <ul class="files">${files.map(([n, w, note]) => `<li><span class="t ${note.startsWith('Not') ? 'off' : ''}">${n}</span>${note ? `<small class="${note.startsWith('Not') ? '' : 'warn'}">${note}</small>` : ''}<small>${w}</small></li>`).join('')}</ul>
    <div class="meter"><div class="nums"><span>7 pieces</span><span>6,880 words</span><span>7 of 7 over 500 words</span></div><div class="bar2"><i style="width:100%"></i></div>
      <p>Enough to calibrate. One file is mostly headers and lists, which makes measured sentences shorter; leave it out unless lists are part of this voice.</p></div>
    <div class="foot"><span class="meta">Calibrates with Qwen3 32B on this Mac, about 3 minutes</span><span class="sp"></span><button class="btn" type="button" data-go="voices">Cancel</button><button class="btn solid" type="button" data-go="calibrating">Create voice</button></div>
  </div></div>`;
}

function chatLeft() {
  return `<aside class="left"><div class="sect">Agents</div>
    <button class="r" type="button"><span class="av" style="background:#6a62d8">H</span><span class="t">Marlow</span><small>built in</small></button>
    <button class="r on" type="button"><span class="av" style="background:#3f8f6b">J</span><span class="t">Juniper</span></button>
    <button class="r" type="button"><span class="av" style="background:#b8743a">W</span><span class="t">Wren</span></button>
    <div class="sect">Recent</div>
    <button class="r" type="button"><span class="t">Seed library flyer</span></button><button class="r" type="button"><span class="t">Allotment rota</span></button></aside>`;
}

function thread(kind) {
  const keptMark = kind === 'kept' ? '<div class="mark">Writing in Newsletter from here</div>' : '';
  const later = kind === 'kept' ? `<div class="mine">Now a shorter version for the noticeboard, under 120 words.</div>
    <div class="msg"><span class="av" style="background:#3f8f6b">J</span><div><div class="who"><b>Juniper</b></div><div class="prose"><p>The seed library opens again on the first Saturday of March, in the porch of the old reading room, where it has always been.</p><p>Bring what you saved. Take what you'll grow. Nobody counts.</p></div>
      <div class="details"><span>In Newsletter voice</span><span>Qwen3 32B</span><span>10:42</span></div></div></div>` : '';
  return `<div class="scroll"><div class="col">
    <div class="mine">Can you draft the spring announcement for the seed library?</div>
    <div class="msg"><span class="av" style="background:#3f8f6b">J</span><div><div class="who"><b>Juniper</b></div><div class="prose"><p>Here's a first pass. I kept it to the dates and what to bring, and left the volunteer call for a second paragraph you can drop if it runs long.</p></div>
      <div class="details"><span>In Plain working voice</span><span>Qwen3 32B</span><span>10:38</span></div></div></div>
    ${keptMark}${later}</div></div>`;
}

function slashMenu() {
  const rows = VOICES;
  return `<div class="cmenu" role="listbox" aria-label="Commands"><div class="h">Writing voices</div>
    ${rows.map((v, i) => `<button class="o ${i === menuIndex ? 'is-active' : ''}" type="button" role="option" aria-selected="${i === menuIndex}" data-pick="${i}"><span class="pt"><span>${esc(v.name)}</span><small>${esc(v.desc)}</small></span>${v.id === 'working' ? '<span class="tag">Juniper replies in this</span>' : v.status === 'changed' ? '<span class="tag">Samples changed</span>' : ''}</button>`).join('')}
    <hr><button class="o link" type="button" data-go="voices"><span class="pt"><span>Manage voices…</span></span></button>
    <div class="keys"><span><kbd>↵</kbd> this message</span><span><kbd>tab</kbd> keep for this chat</span><span><kbd>esc</kbd> close</span></div></div>`;
}

function composer(kind) {
  let input = '<span class="ph">Message Juniper</span>';
  if (kind === 'slash') input = '<span>/</span><span class="caret"></span>';
  if (kind === 'chip') input = `<span class="vchip">${I.pen} Newsletter <button class="pin" type="button" title="Keep for this chat" aria-label="Keep Newsletter for this chat" data-go="kept">${I.pin}</button></span><span>Write the volunteer call as its own short piece</span><span class="caret"></span>`;
  const voiceChip = kind === 'kept'
    ? `<button class="fchip v" type="button" data-act="fmenu">${I.pen} Newsletter</button>`
    : '';
  const fmenu = kind === 'kept' && showF ? `<div class="cmenu fmenu"><div class="h">This chat writes in</div>${VOICES.map((v) => `<button class="o ${v.id === 'newsletter' ? 'is-active' : ''}" type="button"><span class="pt"><span>${esc(v.name)}</span></span></button>`).join('')}<hr><button class="o" type="button" data-go="slash"><span class="pt"><span>Use Juniper's voice</span><small>Plain working for replies, Newsletter for drafts</small></span></button><button class="o link" type="button" data-go="voices"><span class="pt"><span>Manage voices…</span></span></button></div>` : '';
  return `<div class="composer">${kind === 'slash' ? slashMenu() : ''}${fmenu}<div class="box"><div class="input">${input}</div>
    <div class="tools"><button class="fchip" type="button">Seed library</button>${voiceChip}<span class="sp"></span><button class="fchip" type="button">Qwen3 32B · this Mac</button><button class="send" type="button" aria-label="Send">${I.up}</button></div></div></div>`;
}
let showF = false;

function inspector(kind) {
  const replies = 'Plain working';
  return `<aside class="insp"><div class="ident"><span class="av" style="background:#3f8f6b">J</span><span><b>Juniper</b><small>@juniper · Direct message</small></span></div>
    <div class="kicker" style="margin-top:0">Role</div><p>Helps run the community garden: rotas, announcements, the seed library and the occasional grant form.</p>
    <div class="kicker">Writing voice</div><dl class="kv"><dt>Chat replies</dt><dd>${replies}</dd><dt>Drafts</dt><dd>Newsletter</dd>${kind === 'kept' ? '<dt>This chat</dt><dd>Newsletter, kept</dd>' : ''}</dl>
    <div class="row" style="margin-top:0"><button class="btn sm" type="button" data-go="agent">Edit</button><button class="btn sm" type="button">Open SOUL.md</button></div></aside>`;
}

function chatScene(kind) {
  return `${rail('chat')}${chatLeft()}<main class="center"><div class="head"><span class="ttl"><strong>Juniper</strong><small>Direct message · Seed library</small></span></div>${thread(kind)}${composer(kind)}</main>${inspector(kind)}`;
}

function agentSheet() {
  return `<div class="scrim"><div class="sheet" role="dialog" aria-label="Edit Juniper"><h2>Edit Juniper</h2><p class="sub">A new role becomes its standing instructions. Its DM, memory and channels stay.</p>
    <label class="field"><span>Name</span><input value="Juniper"></label>
    <label class="field"><span>Handle</span><input value="juniper"></label>
    <label class="field"><span>Role</span><textarea>Helps run the community garden: rotas, announcements, the seed library and the occasional grant form.</textarea></label>
    <div class="group"><b>Writing voice</b>
      <div class="field"><span>Chat replies</span><div class="picker"><span>Plain working</span><span class="chev">▾</span></div><small>How it talks to you here</small></div>
      <div class="field"><span>Drafts</span><div class="picker"><span>Newsletter</span><span class="chev">▾</span></div><small>Posts, emails and documents it writes for you</small></div>
    </div>
    <div class="foot"><button class="btn sm" type="button" data-go="voices">Manage voices…</button><span class="sp"></span><button class="btn" type="button" data-go="kept">Cancel</button><button class="btn solid" type="button" data-go="kept">Save</button></div></div></div>`;
}

function deleteDialog() {
  return `<div class="scrim"><div class="sheet dialog" role="alertdialog" aria-label="Delete Field notes"><h2>Delete Field notes?</h2>
    <p class="sub" style="color:var(--mut)">Juniper's chat replies and Marlow's drafts go back to No voice. Two chats that kept this voice go back to their agent's voice.</p>
    <p class="sub">The voice's folder, with its 7 samples and style guide, moves to the Trash.</p>
    <div class="foot"><span class="sp"></span><button class="btn" type="button" data-go="card">Cancel</button><button class="btn danger" type="button" data-go="voices">Delete voice</button></div></div></div>`;
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  if (scene === 'voices') html = `${rail('settings')}${settingsNav()}${settingsCenter()}`;
  else if (scene === 'create') html = `${rail('settings')}${settingsNav()}${settingsCenter()}${createSheet()}`;
  else if (scene === 'calibrating') html = `${rail('settings')}${settingsNav()}${settingsCenter(calibratingCard())}`;
  else if (scene === 'card') html = `${rail('settings')}${settingsNav()}${settingsCenter(readyCard())}`;
  else if (scene === 'delete') html = `${rail('settings')}${settingsNav()}${settingsCenter(readyCard())}${deleteDialog()}`;
  else if (scene === 'agent') html = `${chatScene('plain')}${agentSheet()}`;
  else html = chatScene(scene);
  app.innerHTML = html;
  document.querySelectorAll('#scenes .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === scene)));
  clearTimeout(calTimer);
  if (scene === 'calibrating') {
    calTimer = setTimeout(() => { calStep += 1; if (calStep > 4) { calStep = 0; go('card'); } else render(); }, 900);
  }
}

function go(next) {
  scene = next;
  menuIndex = 0;
  editing = false;
  showF = false;
  if (next === 'calibrating') calStep = 0;
  const url = new URL(location.href);
  url.searchParams.set('start', next);
  history.replaceState(null, '', url);
  render();
}

document.getElementById('scenes').innerHTML = SCENES.map(([id, label]) => `<button class="chip" type="button" data-s="${id}">${label}</button>`).join(' ');
document.getElementById('scenes').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) go(b.dataset.s); });
document.getElementById('app').addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g && g.dataset.go) { go(g.dataset.go); return; }
  const p = e.target.closest('[data-pick]');
  if (p) { go(e.shiftKey ? 'kept' : 'chip'); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'edit') { editing = !editing; render(); }
  if (a.dataset.act === 'save') { editing = false; render(); }
  if (a.dataset.act === 'fmenu') { showF = !showF; render(); }
});
document.addEventListener('keydown', (e) => {
  if (scene !== 'slash') return;
  if (e.key === 'ArrowDown') { menuIndex = (menuIndex + 1) % VOICES.length; render(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { menuIndex = (menuIndex + VOICES.length - 1) % VOICES.length; render(); e.preventDefault(); }
  if (e.key === 'Enter') { go('chip'); e.preventDefault(); }
  if (e.key === 'Tab') { go('kept'); e.preventDefault(); }
  if (e.key === 'Escape') { go('plain'); }
});
const themeBtn = document.getElementById('theme');
themeBtn.addEventListener('click', () => {
  const light = document.documentElement.dataset.theme !== 'light';
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  themeBtn.textContent = light ? 'Dark' : 'Light';
});
function fit() {
  const w = Math.min(1, (window.innerWidth - 32) / 1280);
  const f = document.getElementById('fit');
  f.style.transform = `scale(${w})`;
  f.style.height = `${800 * w}px`;
  f.style.width = `${1280 * w}px`;
}
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
