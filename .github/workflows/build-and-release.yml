name: Build and Release

# A push to main releases package.json's version when it has no tag yet; other pushes to main
# do nothing past the version job. Tag pushes and manual runs release the version they name.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          package_version="v$(node -p "require('./package.json').version")"
          release=true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${package_version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
              echo "${version} is already tagged; nothing to release."
              release=false
            fi
          fi
          if [ "${release}" = true ] && [ "${version}" != "${package_version}" ]; then
            echo "::warning::Releasing ${version}, but package.json says ${package_version}, which is the version the app reports."
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Windows / Linux packaging disabled for now — uncomment to re-enable.
        os: [macos-latest]
        # os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact-name: mac
          # - os: windows-latest
          #   platform: win
          #   artifact-name: win
          # - os: ubuntu-latest
          #   platform: linux
          #   artifact-name: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: node scripts/setup-dependencies.js

      - name: Fetch bundled container runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run fetch:container-runtime

      - name: Import Code Signing Certificate (macOS)
        if: matrix.os == 'macos-latest'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERTS }}
          p12-password: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Build distributables
        shell: bash
        run: bun run dist:${{ matrix.platform }}
        env:
          NODE_ENV: production
          # Enable Forge osxSign on macOS runners (certs imported above). Omit locally for unsigned builds.
          OSX_SIGN: ${{ matrix.os == 'macos-latest' && 'true' || '' }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Boundary-${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/*.deb
            out/make/**/*.rpm
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          find ./artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.nupkg" -o \
            -name "*.deb" -o \
            -name "*.rpm" \
          \) -exec cp {} ./release-assets/ \;

          ls -la ./release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          # Tags the commit that was built when the tag doesn't exist yet.
          target_commitish: ${{ github.sha }}
          name: Boundary ${{ needs.version.outputs.version }}
          body: |
            ## Boundary ${{ needs.version.outputs.version }}

            ### Downloads

            **macOS:**
            - `.dmg` - macOS installer
            - `.zip` - macOS app archive (auto-update companion)

            **Windows:**
            - `.exe` - Windows installer (Squirrel)

            **Linux:**
            - `.deb` - Debian/Ubuntu package
            - `.rpm` - Red Hat/Fedora package

            ### Installation Instructions

            **macOS:** Download the `.dmg` file, mount it, and drag Boundary to your Applications folder.

            **Windows:** Download the `.exe` installer and run it.

            **Linux:**
            - For .deb: `sudo dpkg -i Boundary-*.deb`
            - For .rpm: `sudo rpm -i Boundary-*.rpm`
          files: ./release-assets/*
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, 'alpha') || contains(needs.version.outputs.version, 'beta') || contains(needs.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
