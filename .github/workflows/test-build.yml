name: Test Build

# Release workflows call this as a job, so a release can't start from a commit that fails it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows joins once it packages and launches; see docs/windows-linux-plan.md.
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: node scripts/setup-dependencies.js

      - name: Type check
        run: bun run type-check

      - name: Python for embedded-program tests
        # The runner image ships python3; the tests that run Boundary's in-container Python skip without it.
        run: python3 --version

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint
        env:
          # Type-aware lint needs more than the runner's default ~2 GB heap; at 2 GB it aborts
          # with "JavaScript heap out of memory".
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unused files and exports
        run: bun run check:unused

      - name: Repeated blocks
        run: bun run check:duplicates

      - name: Spacing tokens
        run: bun run check:spacing

      - name: Stack archive checksum
        run: bun run check:stack-archive

      - name: Calendar helper tests (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run test:calendar-helper

      - name: Fetch bundled container runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run fetch:container-runtime

      - name: Package application (no distributables)
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify Forge package output
        shell: bash
        run: |
          echo "Package completed successfully on ${{ matrix.os }}"
          ls -la out/ || true
          ls -la .vite/build/ || true
          # Expect a packaged app directory under out/
          if ! ls -d out/* >/dev/null 2>&1; then
            echo "Expected Forge package output under out/" >&2
            exit 1
          fi

      - name: Verify calendar helper in the packaged app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app=$(find out -maxdepth 2 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "No packaged .app under out/" >&2
            exit 1
          fi
          helper="$app/Contents/Resources/calendar-helper/boundary-calendar-helper"
          if [ ! -f "$helper" ] || [ ! -x "$helper" ]; then
            echo "Expected an executable calendar helper at $helper" >&2
            ls -la "$app/Contents/Resources/calendar-helper" || true
            exit 1
          fi
          echo "Calendar helper present and executable: $helper"

      # Ubuntu 24.04 stops unprivileged user namespaces through AppArmor, which Chromium's
      # sandbox needs. Allowing them here keeps the sandbox on for the launch below.
      - name: Allow Chromium's sandbox (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Launch the packaged app (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          exe=$(find out -maxdepth 2 -type f -name Boundary -perm -u+x | head -n 1)
          if [ -z "$exe" ]; then
            echo "No packaged executable under out/" >&2
            exit 1
          fi
          BOUNDARY_SMOKE_EXIT=1 xvfb-run -a "$exe"
