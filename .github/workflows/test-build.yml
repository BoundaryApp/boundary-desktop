name: Test Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows / Linux packaging disabled for now — uncomment to re-enable.
        os: [macos-latest]
        # os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: node scripts/setup-dependencies.js

      - name: Type check
        run: bun run type-check

      - name: Python for embedded-program tests
        # The runner image ships python3; the tests that run Boundary's in-container Python skip without it.
        run: python3 --version

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Unused files and exports
        run: bun run check:unused

      - name: Repeated blocks
        run: bun run check:duplicates

      - name: Fetch bundled container runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: bun run fetch:container-runtime

      - name: Package application (no distributables)
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify Forge package output
        shell: bash
        run: |
          echo "Package completed successfully on ${{ matrix.os }}"
          ls -la out/ || true
          ls -la .vite/build/ || true
          # Expect a packaged app directory under out/
          if ! ls -d out/* >/dev/null 2>&1; then
            echo "Expected Forge package output under out/" >&2
            exit 1
          fi
