name: Build Local (for act)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: node scripts/setup-dependencies.js

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Package application (no distributables)
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify Forge package output
        run: |
          echo "Build completed successfully on Linux (act-friendly)"
          ls -la out/ || true
          ls -la .vite/build/ || true
          if ! ls -d out/* >/dev/null 2>&1; then
            echo "Expected Forge package output under out/" >&2
            exit 1
          fi
